<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 185" width="100%" height="100%">
  <!-- Crisp white background as specified -->
  <rect width="280" height="185" fill="#FFFFFF"/>

  <g transform="translate(10, 8)">
    <!-- Left Blue Triangle -->
    <polygon 
      points="68,14 104,78 38,136" 
      fill="#2984CE" 
    />

    <!-- Center Orange Tick / Checkmark Shape -->
